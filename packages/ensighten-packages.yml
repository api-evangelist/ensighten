note: >-
  Ensighten ships NO client library for the Manage REST API in any language.
  The only first-party packages published to a public registry are two React
  Native bridges to the Ensighten native mobile (iOS/Android) tag-management
  libraries — a different product surface from the Manage API. Both are
  authored by brad.slayter@ensighten.com, maintained by an Ensighten npm
  account, and point at bitbucket.org/ensighten-ondemand, so first-party
  provenance is established; both are also licensed "Proprietary" rather than
  open source. DECAY SIGNAL: the newest of the two was last published
  2020-02-27 — more than six years before this pass, and the Manage API
  blueprint they would sit alongside was updated 2026-07-14. A consumer
  adopting these today is adopting an unmaintained bridge.
