  name: Ensighten SCIM 2.0 API
  description: >-
    SCIM2 (System for Cross-domain Identity Management) is a specification that automates user and group
    identity provisioning across cloud-based applications and services using SSO and Identity Providers.
    These SCIM2 API's enable user and group management through dedicated resources. SCIM follows RESTful
    principles, using HTTP methods with schema-defined payloads that include attributes and values.




    While using the SCIM APIs, set the value of the Accept header as application/scim+json.





    It is suggested to authenticate with the APIs using Authorization: Bearer ens_01.... However, the
