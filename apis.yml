name: Ensighten
description: >-
  Ensighten is an enterprise tag management, data governance, and client-side
  website security platform. It gives digital, marketing, and privacy teams
  centralized control over the third-party tags, scripts, and vendor code that
  run on their web and mobile properties, enforcing consent and privacy rules
  (GDPR, CCPA) at the point of data collection. The platform combines server-
  and client-side tag management, malicious-script and data-leakage detection
  (client-side security), and consent management. Ensighten was acquired by CHEQ
  (CHEQ AI Technologies Ltd.) and is now delivered as part of CHEQ's Control &
  Compliance / Go-to-Market Security suite; the ensighten.com domain
  301-redirects to cheq.ai. This company profile was surfaced as an Insight
  Partners portfolio lead and enriched by the API Evangelist pipeline. Ensighten
  publishes no public REST API, OpenAPI specification, SDK, or developer portal;
  it is a hosted SaaS console (manage.ensighten.com) with a Zendesk-based help
  center, so most spec-derived artifacts are not applicable.
