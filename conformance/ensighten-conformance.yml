standards:
- id: scim2
  name: SCIM 2.0 (RFC 7643 / RFC 7644)
  conforms: true
  evidence: >-
    A dedicated "SCIM 2.0" resource group exposes the canonical SCIM endpoints
    under /scim2 — POST/GET /scim2/Users, GET/PUT/PATCH/DELETE /scim2/Users/{id},
    GET /scim2/Groups, GET /scim2/Groups/{id}, PUT/PATCH /scim2/Groups/{id} —
    including the SCIM PATCH semantics for group-membership updates.
  operations: 10
- id: oauth2
  name: OAuth 2.0 (RFC 6749) — Resource Owner Password Credentials grant
  conforms: true
  partial: true
  evidence: >-
    POST /auth/token with grant_type=password, plus a refresh grant on the same
    endpoint. The docs state requests "follow the Resource Owner Password Flow
    of the OAuth 2.0 specification". No authorization-code flow, no scopes, and
    no /.well-known/oauth-authorization-server metadata document (probed: 403).
  caveat: >-
    ROPC is deprecated in OAuth 2.1 and in the OAuth 2.0 Security Best Current
    Practice. It is the only token-issuing flow this API offers.
