  /manage/tdn/jobs:
    get:
      operationId: getManageTdnJobs
      summary: List jobs
      tags:
      - TDN
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: completed
        in: query
        required: false
        description: Includes completed jobs, default to false.
        schema:
          type: boolean
        example: 'true'
      - name: size
        in: query
        required: false
        description: Limit the per page results, defaults to 100
        schema:
          type: number
        example: '1'
      - name: page
        in: query
        required: false
        description: Results page you want to retrieve (0..N).
        schema:
          type: number
        example: '0'
      - name: sort
        in: query
        required: false
        description: Sort the resulting jobs by the given field name. Acceptable field names are 'createdDate',
          'endDate', 'id', 'startDate', 'status' and 'type'. A '-' prefix indicates sort in descending
          order. By default we sort by id in ascending order.
        schema:
          type: string
        example: +id
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                jobs:
                - createdDate: string
                  endDate: string
                  id: string
                  space:
                    id: 0
                    name: string
                  startDate: string
                  status: RUNNING
                  type: PUBLISH
                  user:
                    id: 0
                    name: string
                  version: 0
                totalElements: 0
                totalPages: 0
