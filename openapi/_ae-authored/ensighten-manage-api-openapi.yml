      parameters:
      - name: id
        in: path
        required: true
        description: Numeric id of the job id to retrieve.
        schema:
          type: number
        example: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                createdDate: string
                endDate: string
                id: string
                space:
                  id: 0
                  name: string
                startDate: string
                status: RUNNING
                type: PUBLISH
                user:
                  id: 0
                  name: string
                version: 0
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key created in the Admin > API Keys page of Manage. Keys are prefixed 'ens_'. Not
        accepted on /auth/token.
    BearerAuth:
      type: http
      scheme: bearer
      description: Access token obtained from POST /auth/token (OAuth 2.0 Resource Owner Password Credentials
        flow).
    OAuth2Password:
      type: oauth2
      flows:
        password:
          tokenUrl: https://manage-api.ensighten.com/auth/token
          scopes: {}
      description: Resource Owner Password Credentials flow. No OAuth scopes are documented; authorization
        is governed by Manage Roles assigned to the user or API Key.
  schemas:
    Error:
      type: object
      description: Standard Manage API error envelope.
      properties:
        code:
          type: integer
          description: Mirrors the HTTP status code.
        message:
          type: string
          description: Standard HTTP status text.
        description:
          type: string
          description: Specific detail about the error.
      required:
      - code
      - message
      - description
      example:
        code: 400
        message: Bad Request
        description: A human-readable description of what went wrong.
security:
- ApiKeyAuth: []
- BearerAuth: []
