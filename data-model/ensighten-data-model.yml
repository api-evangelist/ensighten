    via: 'typeId 30 (Data Definition)'
- name: DataDefinition
  description: >-
    A named client-side data extraction — a JavaScript extractor, optional
    transformation, a trigger and a persistence scope.
  path: /manage/datadefinitions
  fields:
  - id
  - name
  - collection
  - source
  - extractor
  - description
  - enabled
  - persistence
  - metaDesc
  - transformation
  - trigger
  - criteriaIds
  - conditionIds
  source_values:
  - Manage
  - Mobile
  - Pulse
  - One
  - Attribution
  - Inform
  - Privacy
  persistence_values:
  - instance
  - page
  - session
  - visitor
  relationships:
