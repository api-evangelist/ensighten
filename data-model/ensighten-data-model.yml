- name: TdnJob
  description: A Tag Delivery Network job, with an async status machine.
  path: /manage/tdn/jobs
  fields:
  - id
  - version
  - user
  - space
  - status
  - createdDate
  - startDate
  - endDate
  status_values:
  - PENDING
  - INITIALIZED
  - RUNNING
  - INVALIDATING
  - SUCCESSFUL
  - FAILED
  - TIMEOUT
  relationships:
  - belongs_to: Space
    via: space.id
  - belongs_to: User
    via: user.id
  note: >-
    The only asynchronous, pollable resource in the API. There is no webhook or
    callback — completion must be polled via GET /manage/tdn/jobs/{id}.
- name: GitCommit
  description: >-
    A commit in a Git-enabled space; identified by a 40-character SHA-1.
  path: /manage/git/commit/status/{commitId}
  fields:
