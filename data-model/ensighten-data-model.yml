api: Ensighten Manage API
note: >-
  The Manage API publishes no components.schemas — entity shape is documented in
  prose field tables and inline JSON Schema draft-04 fragments per resource
  group. The graph below is derived from those tables plus the id-reference
  fields observed in the example payloads. Identity is integer ids per entity,
  with a parallel string ERN address space (ern:ens:manage::{type}:{id}) used as
  the target of Label batch operations.
identity:
  primary: integer id, unique per entity type
  cross_reference: ERN — 'ern:ens:manage::{resource-type}:{resource-id}'
  ern_types:
  - condition
  - datadefinition
  - deployment
  - event
entities:
- name: Space
  description: >-
    The top-level container. A space groups deployments and publish paths and is
    the unit of publishing; a space may optionally be Git-enabled.
  path: /manage/spaces
  fields:
  - id
  - name
  - publishPaths
  - mandatedConditionIds
  - mandatedConditions
  - mandatedDeployments
  - lastPublished
  - isGitEnabled
  relationships:
  - has_many: PublishPath
    via: publishPaths
  - has_many: Condition
    via: mandatedConditionIds
    note: Conditions mandated across everything in the space.
  - has_many: Deployment
    via: mandatedDeployments
  - has_many: Deployment
    via: 'path nesting /manage/spaces/{spaceId}/deployments'
  - has_many: TdnJob
    via: space.id
  - has_many: GitCommit
    via: 'path nesting /manage/spaces/{id}/commit/{commitId}'
- name: PublishPath
  description: >-
    A named publish target within a space (e.g. stage, prod). Carries the code
    generation settings for the Bootstrap build deployed to customer pages.
  path: /manage/publishpaths
  fields:
  - id
  - name
  - codeGen
  relationships:
  - belongs_to: Space
    via: publishPaths
  - has_one: CodeGen
    via: codeGen
- name: CodeGen
  description: >-
    Embedded value object on a publish path controlling how Manage compiles and
    names the deployed client-side Bootstrap.
  embedded_in: PublishPath
  fields:
  - namespace
  - versionId
  - minificationLevelId
  note: >-
    versionId selects the Bootstrap build (1-14, default v13). Values 1-8 are
    deprecated — see lifecycle/ensighten-lifecycle.yml.
- name: Deployment
  description: >-
    A unit of tag code executed on the customer's pages, with a lifecycle status
    machine spanning enabled/disabled/deleted/archived crossed with
    uncommitted/committed/published.
  path: /manage/spaces/{spaceId}/deployments
  fields:
  - id
  - name
  - spaceId
  - spaceName
  - status
  - previousStatus
  - lastPublishedStatus
  - lastAction
  - executionTime
  - comments
  - ruleId
  - labels
  - code
  status_values:
  - disabled_uncommitted
  - disabled_committed
  - disabled_published
  - enabled_uncommitted
  - enabled_committed
  - enabled_published
  - deleted_uncommitted
  - deleted_committed
  - deleted_published
  - archived_uncommitted
  - archived_committed
  - archived_published
  actions:
  - create
  - enable
  - disable
  - commit
  - uncommit
  - publish
  - edit
  - delete
  - undelete
  - rollback
  - merge
  - archive
  - unarchive
  execution_timing:
  - immediate
  - dom_parsed
  - dom_loaded
  relationships:
  - belongs_to: Space
    via: spaceId
  - has_many: Condition
    via: conditions associated with the deployment
  - has_many: Label
    via: labels
- name: Condition
  description: >-
    A targeting rule deciding whether a deployment or data definition fires.
    Composed of one or more condition-values.
  path: /manage/conditions
  fields:
  - id
  - name
  - conditionValues
  - mandatedInSpaces
  - deployments
  - labels
  relationships:
  - has_many: ConditionValue
    via: conditionValues
  - has_many: Space
    via: mandatedInSpaces
  - has_many: Deployment
    via: deployments
  - has_many: Label
    via: labels
- name: ConditionValue
  description: Embedded criterion — a (typeId, comparatorId, value) triple.
  embedded_in: Condition
  fields:
  - typeId
  - comparatorId
  - value
  type_values:
    2: Host
    4: Path
    7: Protocol
    10: Query Pair
    11: Hash Fragment
    16: Platform
    18: DateTime
    19: Geocode
    20: IP Address
    26: Browser
    27: Do Not Track
    28: Date Recurrence
    30: Data Definition
    31: Query Param
    32: Query Value
    33: Test URLs
    35: Threat Type
  relationships:
