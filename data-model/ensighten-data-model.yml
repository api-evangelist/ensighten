- name: ScimUser
  description: SCIM 2.0 projection of User, for IdP-driven provisioning.
  path: /scim2/Users
  standard: SCIM 2.0
  relationships:
  - projects: User
  - has_many: ScimGroup
- name: ScimGroup
  description: SCIM 2.0 group, whose membership maps onto Manage roles/users.
  path: /scim2/Groups
