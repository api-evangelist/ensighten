- name: EventDefinition
  description: >-
    A named browser or data event that can trigger deployments. Typed
    page_action, data, or named, each with its own allowed field set.
  path: /manage/events
  fields:
  - id
  - name
  - type
  - conditionIds
  - elementType
  - trigger
  - data
  - dataDefinitionId
  - labels
  type_values:
    0: page_action
    1: data
    2: named
  relationships:
  - has_many: Condition
    via: conditionIds
  - belongs_to: DataDefinition
    via: dataDefinitionId
  - has_many: Label
    via: labels
- name: Label
  description: >-
    A key/value tag attachable in batch to any ERN-addressable resource.
  path: /manage/labels
  fields:
  - key
  - value
  - resources
  relationships:
  - has_many: 'Deployment | Condition | DataDefinition | EventDefinition'
    via: 'resources[] of ERNs'
- name: User
  description: A Manage console user, authorized by assigned roles.
  path: /manage/users
  fields:
  - id
  - username
  - firstName
  - lastName
  - email
  - sendNotification
  - multiFactorAuth
  - roleIds
  - isActive
  relationships:
  - has_many: Role
